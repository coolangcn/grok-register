async function pollLogs(){try{const r=await fetch('/api/logs?after='+lastSeq);if(!r.ok)return;const d=await r.json();const latest=Number(d.latest)||0;if(latest&&latest<lastSeq){lastSeq=0;$('terminal').innerHTML='<div id="emptyLog" class="empty-log">'+t('logReady')+'</div>'}serverLatest=latest||lastSeq;for(const e of d.entries||[]){appendLine(e);lastSeq=Math.max(lastSeq,Number(e.seq)||0)}}catch(_){}}
function updateStatusText(s={}){lastStatus=s;const dot=$('statusDot');dot.className='status-dot'+(running?' running':(s.cancelled?' cancelled':''));$('sStatus').textContent=running?t('running'):(s.cancelled?t('stopped'):t('idle'));$('startBtn').hidden=running;$('stopBtn').hidden=!running}
async function pollStatus(){try{const r=await fetch('/api/status');if(!r.ok)return;const s=await r.json();running=!!s.running;$('sTarget').textContent=s.target||0;$('sSuccess').textContent=s.success||0;$('sFail').textContent=s.fail||0;$('sPending').textContent=s.pending||0;$('sUncertain').textContent=s.uncertain||0;$('sWarnings').textContent=s.warnings||0;updateStatusText(s);setFormDisabled(running);if(s.error)setNotice(s.error,true)}catch(_){}}
async function copyLogs(){const text=[...$('terminal').querySelectorAll('.line')].map(x=>x.textContent).join('\n');try{await navigator.clipboard.writeText(text);flashNotice('✓ '+t('copied'))}catch(_){flashNotice(t('copyFailed'),true)}}
function clearLogs(){const body=$('terminal');body.innerHTML='<div id="emptyLog" class="empty-log">'+t('logReady')+'</div>';lastSeq=serverLatest}
function bind(){renderFields();applyLanguage();$('langZh').onclick=()=>setLanguage('zh');$('langEn').onclick=()=>setLanguage('en');$('saveBtn').onclick=()=>saveConfig().catch(e=>flashNotice(e.message,true));$('startBtn').onclick=()=>startJob().catch(e=>flashNotice(e.message,true));$('stopBtn').onclick=()=>stopJob().catch(e=>flashNotice(e.message,true));$('copyBtn').onclick=()=>copyLogs();$('clearBtn').onclick=()=>clearLogs();loadConfig().catch(e=>flashNotice(e.message,true));pollStatus();pollLogs();setInterval(pollStatus,1000);setInterval(pollLogs,1000)}
bind();
</script>
</body>
</html>
